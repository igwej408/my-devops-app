trigger:
  - main

variables:
  acrName: 'igwej407acr'
  imageName: 'myapp'
  webAppName: 'igwej407webapp'
  resourceGroup: 'my-devops-rg'

stages:

- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: Docker@2
      displayName: 'Build and Push to ACR'
      inputs:
        command: buildAndPush
        containerRegistry: 'my-acr-connection'
        repository: $(imageName)
        dockerfile: '**/Dockerfile'
        tags: |
          $(Build.BuildId)
          latest

- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn: Build
  jobs:
  - job: DeployJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: AzureWebAppContainer@1
      displayName: 'Deploy Container to App Service'
      inputs:
        azureSubscription: 'my-azure-connection'
        appName: $(webAppName)
        containers: $(acrName).azurecr.io/$(imageName):$(Build.BuildId)