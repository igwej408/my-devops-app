trigger:
  - main

variables:
  acrLoginServer: 'igwej407acr.azurecr.io'
  imageName: 'myapp'
  webAppName: 'igwej407webapp'

stages:

- stage: Build
  displayName: 'Build and Push Docker Image'
  jobs:
  - job: BuildJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - script: |
        echo $(ACR_PASSWORD) | docker login igwej407acr.azurecr.io \
          --username $(ACR_USERNAME) \
          --password-stdin
      displayName: 'Login to ACR'

    - script: |
        docker build -t igwej407acr.azurecr.io/myapp:$(Build.BuildId) \
                     -t igwej407acr.azurecr.io/myapp:latest .
      displayName: 'Build Docker Image'

    - script: |
        docker push igwej407acr.azurecr.io/myapp:$(Build.BuildId)
        docker push igwej407acr.azurecr.io/myapp:latest
      displayName: 'Push to ACR'

- stage: Deploy
  displayName: 'Deploy to Azure App Service'
  dependsOn: Build
  jobs:
  - job: DeployJob
    pool:
      vmImage: 'ubuntu-latest'
    steps:

    - task: AzureWebAppContainer@1
      displayName: 'Deploy to App Service'
      inputs:
        azureSubscription: 'my-azure-connection'
        appName: $(webAppName)
        containers: $(acrLoginServer)/$(imageName):$(Build.BuildId)